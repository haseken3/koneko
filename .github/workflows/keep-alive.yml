name: Keep Alive

on:
  schedule:
    # 6時間おきにアクセス（UTC: 0:00, 6:00, 12:00, 18:00 → JST: 9:00, 15:00, 21:00, 3:00）
    - cron: "0 */6 * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: curl -s -o /dev/null -w "%{http_code}" https://koneko-narration-counter.streamlit.app/
